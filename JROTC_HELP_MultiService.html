<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09234b">
<title>JROTC HELP</title>
<style>
:root{--navy:#09234b;--gold:#e2b84e;--white:#fff;--bg:#f3f6fb;--ink:#17243b;--muted:#64748b;--line:#dce3ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--navy);color:white;padding:18px 16px 14px;border-bottom:4px solid var(--gold)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;letter-spacing:2px;color:#f1ce70;font-weight:800}.brand{font-size:27px;font-weight:850;margin:3px 0}.sub{font-size:12px;opacity:.85}
button,input,textarea,select{font:inherit}button{cursor:pointer}.refresh{border:0;border-radius:10px;background:white;color:var(--navy);font-weight:800;padding:10px 12px}
#status{min-height:17px;font-size:12px;color:#f1ce70;margin-top:9px}
nav{display:flex;gap:5px;overflow-x:auto;padding:9px;background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.tab{white-space:nowrap;border:0;border-radius:9px;padding:10px 12px;background:#eef2f8;color:#243752;font-weight:750}.tab.active{background:var(--navy);color:white}
main{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;margin:0 0 12px;box-shadow:0 2px 6px #09234b08}
h2{font-size:21px;margin:0 0 8px;color:var(--navy)}h3{font-size:15px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.5}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:#f1f5fb;border-radius:10px;padding:12px}.stat strong{display:block;color:var(--navy);font-size:22px}
.btn{display:inline-block;background:var(--navy);color:white;border:0;border-radius:9px;padding:11px 14px;font-weight:750;margin:4px 4px 4px 0}.gold{background:var(--gold);color:#17243b}.danger{background:#fff0ef;color:#8c2924}
label{font-size:13px;font-weight:700;display:block;margin-top:8px}.field{display:block;width:100%;border:1px solid #cbd5e3;border-radius:9px;padding:11px;margin:5px 0 12px;background:white;color:var(--ink)}textarea{resize:vertical}
.item{border-top:1px solid #e5eaf1;padding:10px 0;overflow-wrap:anywhere}.item p{white-space:pre-wrap}
.hero{background:var(--navy);color:white;border-radius:14px;padding:17px;margin-bottom:12px}.hero h2{color:white}
footer{text-align:center;color:var(--muted);font-size:11px;padding:14px}
@media(min-width:650px){main{padding:22px}.brand{font-size:30px}}
</style>
</head>
<body>
<header><div class="top"><div><div class="eyebrow">NAVY • GOLD • WHITE</div><div class="brand">JROTC HELP</div><div class="sub">Your cadet success dashboard</div></div><button class="refresh" id="refresh">↻ Refresh</button></div><div id="status" role="status">Ready</div></header>
<nav id="nav"><button class="tab active" data-tab="Home">⌂ Home</button><button class="tab" data-tab="PT Tracking">PT Tracking</button><button class="tab" data-tab="Teams & Records">Teams & Records</button><button class="tab" data-tab="Inspections">Inspections</button><button class="tab" data-tab="Medals & Rank">Medals & Rank</button><button class="tab" data-tab="Awards">Awards</button><button class="tab" data-tab="Meets & Calendar">Meets & Calendar</button><button class="tab" data-tab="Service Hours">Service Hours</button><button class="tab" data-tab="Drill Dojo">Drill Dojo</button><button class="tab" data-tab="Uniform Guide">Uniform Guide</button><button class="tab" data-tab="Study">Study</button><button class="tab" data-tab="Unit & Accounts">Unit & Accounts</button><button class="tab" data-tab="Profile">Profile</button></nav>
<main id="content"></main><footer>JROTC HELP • Independent prototype • Not an official Navy application</footer>
<script>
(()=>{
const KEY='jrotc-help-standalone-v1';
const defaults=()=>({profile:{name:'Cadet',rank:'Cadet',role:'Cadet',service:'Navy NJROTC',unit:'My JROTC Unit'},pt:[],awards:[],quizBest:0,cadets:[],participation:[],inspections:[],medals:[],rankHistory:[],meets:[],uniformNotes:[],serviceHours:[]});
const clone=x=>JSON.parse(JSON.stringify(x));
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x||typeof x!=='object')return defaults();let d=defaults();return {...d,...x,profile:{...d.profile,...x.profile},pt:Array.isArray(x.pt)?x.pt:[],awards:Array.isArray(x.awards)?x.awards:[],cadets:Array.isArray(x.cadets)?x.cadets:[],participation:Array.isArray(x.participation)?x.participation:[],inspections:Array.isArray(x.inspections)?x.inspections:[],medals:Array.isArray(x.medals)?x.medals:[],rankHistory:Array.isArray(x.rankHistory)?x.rankHistory:[],meets:Array.isArray(x.meets)?x.meets:[],uniformNotes:Array.isArray(x.uniformNotes)?x.uniformNotes:[],serviceHours:Array.isArray(x.serviceHours)?x.serviceHours:[]}}catch{return defaults()}}
let data=load(),tab='Home';
const content=document.querySelector('#content'),status=document.querySelector('#status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=(title,body)=>`<section class="card"><h3>${title}</h3>${body}</section>`;
const btn=(label,action,cls='')=>`<button class="btn ${cls}" data-action="${action}">${label}</button>`;
const field=(label,id,value='',type='text',placeholder='')=>`<label for="${id}">${label}</label><input class="field" id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}">`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));status.textContent='✓ Saved on this device';return true}catch{status.textContent='Browser storage is unavailable. Export a backup to keep your records.';return false}}
function render(){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 let h='';
 if(tab==='Home'){
 h=`<section class="hero"><div class="eyebrow">WELCOME BACK</div><h2>Ready, ${esc(data.profile.name)}?</h2><div>${esc(data.profile.rank)} • ${esc(data.profile.role)}</div></section><div class="row"><div class="stat"><strong>${data.pt.length}</strong><span class="muted">PT records</span></div><div class="stat"><strong>${data.awards.length}</strong><span class="muted">Achievements logged</span></div><div class="stat"><strong>${data.participation.length}</strong><span class="muted">Participation records</span></div><div class="stat"><strong>${data.inspections.length}</strong><span class="muted">Inspection records</span></div></div>`;
 h+=card('Cadet tools','<p class="muted">Choose a section to manage your progress.</p>'+btn('＋ Log PT','go-pt')+btn('＋ Add achievement','go-awards')+btn('Start study quiz','go-study')+btn('Edit profile','go-profile'));
 h+=card('Reminder','<p class="muted">Record accomplishments while they are fresh. Confirm official award requirements with your NJROTC instructor.</p>');
 }else if(tab==='PT Tracking'){
 h='<h2>PT Tracking</h2><p class="muted">Record your results and track progress over time.</p>';
 h+=card('Add a PT record',`<form id="pt-form">${field('Date','pt-date',new Date().toISOString().slice(0,10),'date')}${field('Push-ups','push','','number','Number completed')}${field('Plank (seconds)','plank','','number','e.g. 180')}${field('Run time (minutes)','run','','number','Optional: total minutes')}<label for="pt-note">Notes</label><textarea id="pt-note" class="field" rows="2" placeholder="Event, goal, or notes"></textarea><button class="btn" type="submit">Save PT record</button></form>`);
 h+=card('Saved records',data.pt.length?data.pt.slice().reverse().map((p,i)=>`<div class="item"><b>${esc(p.date)}</b><div class="muted">Push-ups: ${esc(p.push||'—')} • Plank: ${esc(p.plank||'—')} sec • Run: ${esc(p.run||'—')} min</div><div class="muted">${esc(p.note||'')}</div>${btn('Delete','delete-pt-'+(data.pt.length-1-i),'danger')}</div>`).join(''):'<p class="muted">No PT records yet.</p>');
 }else if(tab==='Awards'){
 h='<h2>Awards & Achievements</h2><p class="muted">Keep a personal log of leadership, service, academics, fitness, and teamwork. This is not an official award submission.</p>';
 h+=card('Add an accomplishment',`<form id="award-form">${field('Title','award-title','','text','e.g. Led and organized PT meet')}<label for="award-category">Category</label><select id="award-category" class="field"><option>Leadership</option><option>Physical Fitness</option><option>Teamwork</option><option>Academics</option><option>Community Service</option><option>Drill</option><option>Aviation / STEM</option><option>Other</option></select><label for="award-detail">What you did and its impact</label><textarea id="award-detail" class="field" rows="4" placeholder="Describe your actions, responsibility, and results."></textarea><button class="btn" type="submit">Save achievement</button></form>`);
 h+=card('Achievement log',data.awards.length?data.awards.slice().reverse().map((a,i)=>`<div class="item"><b>${esc(a.title)}</b><div class="muted">${esc(a.category)} • ${esc(a.date)}</div><p>${esc(a.detail)}</p>${btn('Delete','delete-award-'+(data.awards.length-1-i),'danger')}</div>`).join(''):'<p class="muted">Your accomplishments will appear here.</p>');
 }else if(tab==='Teams & Records'){
 h='<h2>Teams & Participation Records</h2><p class="muted">Keep a dated record of which cadet participated in which team or event. Add a cadet first, then log participation. This is a local record—not an official NJROTC roster.</p>';
 h+=card('Add cadet',`<form id="cadet-form">${field('Cadet name or ID (use a school-approved identifier)','cadet-name','','text','Name or approved ID')}${field('Current rank','cadet-rank','','text','e.g. NS1, NS2, NS3, NS4')}${field('Platoon / role (optional)','cadet-role','','text','Platoon or leadership role')}<button class="btn" type="submit">Save cadet</button></form>`);
 h+=card('Log participation',`<form id="participation-form"><label for="part-cadet">Cadet</label><select class="field" id="part-cadet" required>${data.cadets.map((c,i)=>`<option value="${i}">${esc(c.name)} — ${esc(c.rank||'Rank not entered')}</option>`).join('')}</select><label for="part-team">Team / activity</label><select class="field" id="part-team"><option>Armed Drill</option><option>Armed Exhibition</option><option>Academics</option><option>Unarmed Exhibition</option><option>Color Guard</option><option>JLAB</option><option>Cybersecurity</option><option>Drones</option><option>Physical Fitness</option><option>Orienteering</option><option>Marksmanship</option><option>Other</option></select>${field('Date participated','part-date',new Date().toISOString().slice(0,10),'date')}${field('Event / practice name','part-event','','text','Practice, meet, ceremony, competition')}${field('Result / hours (optional)','part-result','','text','Role, placement, hours, or outcome')}<label for="part-verified">Verification</label><select class="field" id="part-verified"><option>Needs verification</option><option>Verified by instructor</option><option>Verified by team coach</option><option>Evidence attached / recorded</option></select><label for="part-notes">Notes</label><textarea class="field" id="part-notes" rows="2" placeholder="What did the cadet do?"></textarea><button class="btn" type="submit">Save participation</button></form>`);
 h+=card('Participation history',data.participation.length?data.participation.slice().reverse().map((r,i)=>`<div class="item"><b>${esc(r.cadetName)} — ${esc(r.team)}</b><div class="muted">${esc(r.date)} • ${esc(r.event||'Activity')} • ${esc(r.verification)}</div><div>${esc(r.result||'')}</div><p>${esc(r.notes||'')}</p>${btn('Delete','delete-part-'+(data.participation.length-1-i),'danger')}</div>`).join(''):'<p class="muted">No participation logged yet.</p>');
 h+=card('Cadet roster',data.cadets.length?data.cadets.map((c,i)=>`<div class="item"><b>${esc(c.name)}</b><div class="muted">${esc(c.rank||'Rank not entered')} • ${esc(c.role||'No role entered')} • ${data.participation.filter(r=>r.cadetIndex===i).length} participation records</div>${btn('Delete cadet','delete-cadet-'+i,'danger')}</div>`).join(''):'<p class="muted">Add cadets to start a roster.</p>');
 }else if(tab==='Inspections'){
 h='<h2>Inspection Readiness</h2><p class="muted">Record inspection scores, dates, notes, and readiness checks before an inspection or awards ceremony. Confirm the required standard with your instructor.</p>';
 h+=card('Record inspection',`<form id="inspection-form">${field('Inspection date','insp-date',new Date().toISOString().slice(0,10),'date')}${field('Inspection / event','insp-name','','text','Uniform inspection, AMI, awards ceremony')}${field('Cadet or unit inspected','insp-who','','text','Cadet name, platoon, or unit')}${field('Score','insp-score','','number','Enter score received')}${field('Maximum possible score','insp-max','100','number','e.g. 100')}<label for="insp-check">Readiness checklist</label><div class="muted">Check items verified as complete; leave unchecked if not confirmed.</div><label><input type="checkbox" id="ck-uniform"> Uniform inspected against current instructions</label><label><input type="checkbox" id="ck-groom"> Grooming standards reviewed</label><label><input type="checkbox" id="ck-knowledge"> Required knowledge reviewed</label><label><input type="checkbox" id="ck-records"> Participation / award records checked</label><label><input type="checkbox" id="ck-approval"> Instructor / chain-of-command confirmation received</label><label for="insp-notes">Notes / corrections needed</label><textarea class="field" id="insp-notes" rows="3" placeholder="Items to fix before next inspection"></textarea><button class="btn" type="submit">Save inspection</button></form>`);
 h+=card('Inspection history',data.inspections.length?data.inspections.slice().reverse().map((r,i)=>`<div class="item"><b>${esc(r.name)} — ${esc(r.who||'Cadet/unit not specified')}</b><div class="muted">${esc(r.date)} • Score: ${esc(r.score)}/${esc(r.max)} (${r.max?Math.round(Number(r.score)/Number(r.max)*100):0}%)</div><div class="muted">Readiness: ${r.checks.filter(Boolean).length}/5 checks confirmed</div><p>${esc(r.notes||'')}</p>${btn('Delete','delete-insp-'+(data.inspections.length-1-i),'danger')}</div>`).join(''):'<p class="muted">No inspections recorded yet.</p>');
 }else if(tab==='Medals & Rank'){
 h='<h2>Medals, Ribbons & Rank</h2><p class="muted">Track what each cadet earned, when it was awarded, and whether an instructor has verified it. This is a personal tracker, not an official award authority.</p>';
 h+=card('Log a medal / ribbon / award',`<form id="medal-form">${field('Cadet name','medal-cadet','','text','Name as on roster')}${field('Medal, ribbon, or award name','medal-name','','text','Use official name from your unit')}${field('Date earned / awarded','medal-date',new Date().toISOString().slice(0,10),'date')}<label for="medal-status">Verification status</label><select id="medal-status" class="field"><option>Needs verification</option><option>Verified by instructor</option><option>Pending approval</option></select><label for="medal-evidence">Citation / reason / evidence</label><textarea id="medal-evidence" class="field" rows="3" placeholder="Why awarded; ceremony or approving authority"></textarea><button class="btn" type="submit">Save award record</button></form>`);
 h+=card('Award records',data.medals.length?data.medals.slice().reverse().map((m,i)=>`<div class="item"><b>${esc(m.cadet)} — ${esc(m.name)}</b><div class="muted">${esc(m.date)} • ${esc(m.status)}</div><p>${esc(m.evidence||'')}</p>${btn('Delete','delete-medal-'+(data.medals.length-1-i),'danger')}</div>`).join(''):'<p class="muted">No medals or ribbons recorded yet.</p>');
 h+=card('Rank history',`<form id="rank-form">${field('Cadet name','rank-cadet','','text','Cadet name')}${field('Rank / rate','rank-value','','text','e.g. NS2, NS3, NS4, unit rank')}${field('Effective date','rank-date',new Date().toISOString().slice(0,10),'date')}<label for="rank-verified">Status</label><select id="rank-verified" class="field"><option>Needs verification</option><option>Verified by instructor</option></select><button class="btn" type="submit">Save rank history</button></form>`+(data.rankHistory.length?data.rankHistory.slice().reverse().map((r,i)=>`<div class="item"><b>${esc(r.cadet)} — ${esc(r.rank)}</b><div class="muted">Effective ${esc(r.date)} • ${esc(r.status)}</div>${btn('Delete','delete-rank-'+(data.rankHistory.length-1-i),'danger')}</div>`).join(''):'<p class="muted">No rank history recorded yet.</p>'));
  }else if(tab==='Meets & Calendar'){
 h='<h2>Meets, Competitions & Calendar</h2><p class="muted">Record every meet or competition, the teams represented, participating cadets, date, location/area, results, and verification.</p>';
 h+=card('Log a meet or competition',`<form id="meet-form">${field('Meet / competition name','meet-name','','text','Drill meet, JLAB, PT meet, marksmanship meet')}${field('Date','meet-date',new Date().toISOString().slice(0,10),'date')}${field('Location / area / region','meet-area','','text','School, host, Area/Region')}${field('Teams represented','meet-teams','','text','Color Guard, Armed Drill, Academics')}${field('Participating cadets (names or approved IDs)','meet-cadets','','text','Comma-separated names or approved IDs')}${field('Results / placement','meet-result','','text','Optional result or placement')}<label for="meet-verified">Record status</label><select id="meet-verified" class="field"><option>Needs verification</option><option>Verified by staff / instructor</option></select><label for="meet-notes">Notes</label><textarea id="meet-notes" class="field" rows="2" placeholder="Team roles, participation details, follow-up"></textarea><button class="btn" type="submit">Save meet record</button></form>`);
 h+=card('Meet history',data.meets.length?data.meets.slice().reverse().map((m,i)=>`<div class="item"><b>${esc(m.name)}</b><div class="muted">${esc(m.date)} • ${esc(m.area||'Area not entered')} • ${esc(m.status)}</div><div><b>Teams:</b> ${esc(m.teams||'—')}</div><div><b>Cadets:</b> ${esc(m.cadets||'—')}</div><div><b>Result:</b> ${esc(m.result||'—')}</div><p>${esc(m.notes||'')}</p>${btn('Delete record','delete-meet-'+(data.meets.length-1-i),'danger')}</div>`).join(''):'<p class="muted">No meets or competitions recorded yet.</p>');
 h+=card('Military service birthdays',`<div class="item"><b>U.S. Army — June 14</b></div><div class="item"><b>U.S. Coast Guard — August 4</b></div><div class="item"><b>U.S. Air Force — September 18</b></div><div class="item"><b>U.S. Navy — October 13</b></div><div class="item"><b>U.S. Marine Corps — November 10</b></div><div class="item"><b>U.S. Space Force — December 20</b></div><p class="muted">These are service founding/birthday observances. Confirm dates and event plans with your instructor before publishing a unit calendar.</p>`);
 }else if(tab==='Service Hours'){
 h='<h2>Service Hours & Volunteer Log</h2><p class="muted">Track community service, unit service, and supply/logistics work by date. Keep an honest record of hours and have an authorized staff member verify them. This prototype saves records only in this browser.</p>';
 const total=data.serviceHours.reduce((sum,r)=>sum+Number(r.hours||0),0);
 const community=data.serviceHours.filter(r=>r.category==='Community service').reduce((sum,r)=>sum+Number(r.hours||0),0);
 const unit=data.serviceHours.filter(r=>r.category==='Unit service').reduce((sum,r)=>sum+Number(r.hours||0),0);
 const supply=data.serviceHours.filter(r=>r.category==='Supply / logistics').reduce((sum,r)=>sum+Number(r.hours||0),0);
 h+=`<div class="row"><div class="stat"><strong>${total.toFixed(1)}</strong><span class="muted">Total hours</span></div><div class="stat"><strong>${community.toFixed(1)}</strong><span class="muted">Community service</span></div><div class="stat"><strong>${unit.toFixed(1)}</strong><span class="muted">Unit service</span></div><div class="stat"><strong>${supply.toFixed(1)}</strong><span class="muted">Supply / logistics</span></div></div>`;
 h+=card('Log service hours',`<form id="service-hours-form">${field('Cadet name or approved ID','svc-cadet','','text','Use school-approved identifier')}<label for="svc-category">Service category</label><select class="field" id="svc-category"><option>Community service</option><option>Unit service</option><option>Supply / logistics</option><option>School service</option><option>Other approved service</option></select>${field('Date performed','svc-date',new Date().toISOString().slice(0,10),'date')}${field('Hours completed','svc-hours','','number','e.g. 2.5')} ${field('Event / task','svc-task','','text','Food drive, unit cleanup, supply inventory')} ${field('Supervisor / organization (optional)','svc-supervisor','','text','Supervisor name or organization')}<label for="svc-verification">Verification status</label><select class="field" id="svc-verification"><option>Needs verification</option><option>Verified by staff</option><option>Verified by community supervisor</option></select><label for="svc-notes">Notes / evidence reference</label><textarea class="field" id="svc-notes" rows="2" placeholder="What was done? Do not include sensitive personal details."></textarea><button class="btn" type="submit">Save service record</button></form>`);
 h+=card('Service history',data.serviceHours.length?data.serviceHours.slice().reverse().map((r,i)=>`<div class="item"><b>${esc(r.cadet)} — ${esc(r.category)}</b><div class="muted">${esc(r.date)} • ${esc(r.hours)} hours • ${esc(r.verification)}</div><div>${esc(r.task)}</div><div class="muted">${esc(r.supervisor||'')} ${r.notes?'• '+esc(r.notes):''}</div>${btn('Delete record','delete-service-'+(data.serviceHours.length-1-i),'danger')}</div>`).join(''):'<p class="muted">No service hours logged yet.</p>');
 }else if(tab==='Drill Dojo'){
 h='<h2>Drill Dojo</h2><p class="muted">A study and practice planner for drill teams. Follow your service manual, competition rulebook, and instructor. This guide does not replace supervised instruction.</p>';
 h+=card('Armed drill & exhibition practice',`<h3>Practice plan</h3><ol><li>Review the current competition rules and team routine with the instructor.</li><li>Warm up, inspect the practice area, and confirm everyone understands safety rules.</li><li>Practice timing, spacing, alignment, uniformity, and commands at a pace approved by the instructor.</li><li>Use only instructor-approved training equipment; keep all equipment pointed/positioned as directed and never improvise stunts.</li><li>Run a supervised rehearsal, note corrections, and record the practice date.</li></ol><p class="muted">No weapon manipulation sequence is provided here. Armed exhibition must be taught in person by a qualified instructor using approved equipment and rules.</p>${field('Practice date','dojo-date',new Date().toISOString().slice(0,10),'date')}${field('Team','dojo-team','','text','Armed Drill / Armed Exhibition / Unarmed Exhibition')}${field('Practice goal','dojo-goal','','text','Timing, alignment, command voice, teamwork')}<label for="dojo-notes">Instructor-approved notes</label><textarea id="dojo-notes" class="field" rows="3" placeholder="What to improve next practice"></textarea><button class="btn" data-action="save-dojo">Save practice note</button><div id="dojo-saved" class="muted"></div>`);
 h+=card('Command voice & platoon leadership',`<ul><li>Stand balanced and attentive; use a clear, projected voice without shouting yourself hoarse.</li><li>Know the exact command wording and sequence from your service's drill manual.</li><li>Give commands at the timing taught by your instructor; avoid adding unofficial wording.</li><li>Practice facing the formation, clear communication, cadence, and calm corrections.</li><li>Ask a qualified instructor to demonstrate platoon, guide-on, and ceremonial sword detail procedures.</li></ul><p><b>Guide-on practice checklist:</b> identify assigned positions, confirm spacing and route with the instructor, rehearse coordinated movement, and review safety and event protocol.</p><p><b>Sword detail:</b> ceremonial sword commands and movements should be taught directly by a qualified instructor. Use approved training practice only and do not practice unsupervised.</p>`);
 }else if(tab==='Uniform Guide'){
 h='<h2>Uniform Fitting & Measurements</h2><p class="muted">Use this checklist to prepare for a fitting. Exact measurements and wear standards vary by service, uniform, and current instructions.</p>';
 h+=card('Fitting checklist',`<ul><li>Confirm the correct service, uniform type, and current uniform instruction.</li><li>Ask authorized staff to help check fit, length, placement, and required accessories.</li><li>Check the official guide for insignia, ribbons, nameplate, footwear, and grooming standards.</li><li>Record any alterations or items to exchange and the date checked.</li></ul><p class="muted"><b>Privacy:</b> body measurements are personal information, especially for minors. This prototype intentionally does not store detailed body measurements. Keep fitting details with the cadet and authorized uniform staff, not in a broadly shared roster.</p><form id="uniform-form">${field('Cadet name or approved ID','uniform-cadet','','text','Use approved identifier')}${field('Service / uniform type','uniform-type','','text','e.g. Navy NJROTC service uniform')}${field('Fitting date','uniform-date',new Date().toISOString().slice(0,10),'date')}${field('Items to check or exchange','uniform-items','','text','Sleeve length, trouser length, insignia placement') }<label for="uniform-status">Status</label><select id="uniform-status" class="field"><option>Needs fitting</option><option>Checked with staff</option><option>Ready for inspection</option></select><button class="btn" type="submit">Save fitting checklist</button></form>`);
 h+=card('Saved fitting checklists',data.uniformNotes.length?data.uniformNotes.slice().reverse().map((u,i)=>`<div class="item"><b>${esc(u.cadet)} — ${esc(u.type)}</b><div class="muted">${esc(u.date)} • ${esc(u.status)}</div><div>${esc(u.items||'')}</div>${btn('Delete','delete-uniform-'+(data.uniformNotes.length-1-i),'danger')}</div>`).join(''):'<p class="muted">No fitting checklists recorded.</p>');
 }else if(tab==='Study'){
 h='<h2>Study & Quiz</h2><p class="muted">Practice basic leadership and cadet skills. Confirm program-specific rules with your instructor.</p>';
h+=card('Choose a service study module',`<p class="muted">Select the branch assigned to your unit profile. Content below is introductory and should be checked against current official materials.</p><label for="study-service">JROTC program</label><select class="field" id="study-service"><option>Navy NJROTC</option><option>Army JROTC</option><option>Air Force JROTC</option><option>Marine Corps JROTC</option><option>Space Force-related study</option><option>Coast Guard-related study</option></select><div id="service-study"></div>`);
 h+=card('Knowledge reference: commands, ranks & service basics',`<p><b>Chain of command:</b> Learn the civilian leadership structure and the command structure for the service your unit represents. Start with the President and Secretary of Defense, then study the current service leadership and your unit's instructor / cadet chain. Names change, so use current official sources for the people holding each office.</p><p><b>General orders:</b> The traditional 11 General Orders of a Sentry are commonly taught in Navy and Marine Corps contexts, but applicability and exact wording can vary by program. Learn the version assigned by your instructor rather than assuming one list applies to every service.</p><p><b>Ranks:</b> Study enlisted and officer rank insignia separately for each service. Rank names, insignia, and cadet rank systems are not interchangeable between JROTC programs.</p><p><b>Uniforms:</b> Use the current service and program uniform manual for measurement, fit, insignia placement, ribbons, and grooming requirements. Do not rely on a generic chart for official inspection decisions.</p><p><b>Suggested study sequence:</b> (1) service history and mission, (2) core values, (3) ranks and insignia, (4) chain of command, (5) general orders as assigned, (6) drill commands and ceremonies, (7) uniform knowledge, (8) awards and ribbons, (9) citizenship and leadership.</p><p class="muted">This is a starter guide, not an exhaustive official knowledge database. Content should be reviewed by instructors and linked to current approved manuals before use across multiple schools.</p>`);
 h+=card('Quick quiz',`<form id="quiz-form"><p><b>1. What is a key purpose of teamwork?</b></p><label><input type="radio" name="q1" value="a" required> Coordinate toward a shared goal</label><label><input type="radio" name="q1" value="b"> Avoid communicating</label><p><b>2. If instructions are unclear, you should…</b></p><label><input type="radio" name="q2" value="a" required> Guess without asking</label><label><input type="radio" name="q2" value="b"> Respectfully ask for clarification</label><p><b>3. What strengthens an achievement entry?</b></p><label><input type="radio" name="q3" value="a" required> Specific actions and results</label><label><input type="radio" name="q3" value="b"> Only saying “I did a good job”</label><p><button class="btn" type="submit">Check answers</button></p></form><div id="quiz-result"></div><p class="muted">Best score saved: ${Number(data.quizBest)||0}/3</p>`);
 }else if(tab==='Unit & Accounts'){
 h='<h2>Unit & Accounts</h2><p class="muted">Multi-unit workspace design for Navy, Army, Air Force, and Marine Corps JROTC.</p>';
 h+=card('Shared account setup','<p><b>Prototype status: local demo only.</b> This file does not authenticate users or sync records to a server. Do not enter real student rosters or sensitive information until a secure backend is connected.</p><p class="muted">Production setup should use an approved identity provider, encrypted transport and storage, role-based permissions, unit separation, audit logs, account recovery, and instructor-controlled access.</p>');
 h+=card('Access roles','<div class="item"><b>Cadet</b><div class="muted">View own record, study modules, and submit participation for review.</div></div><div class="item"><b>Team leader / staff</b><div class="muted">Manage team event logs and submit inspection preparation updates.</div></div><div class="item"><b>Instructor / administrator</b><div class="muted">Approve records, manage roster and roles, verify awards and rank history, and export unit reports.</div></div>');
 h+=card('Unit workspace preview',`<form id="unit-form">${field('Unit / school name','unit-name',data.profile.unit||'My JROTC Unit','text','Use a non-sensitive display name')}<label for="unit-service">Service branch</label><select class="field" id="unit-service"><option ${data.profile.service==='Navy NJROTC'?'selected':''}>Navy NJROTC</option><option ${data.profile.service==='Army JROTC'?'selected':''}>Army JROTC</option><option ${data.profile.service==='Air Force JROTC'?'selected':''}>Air Force JROTC</option><option ${data.profile.service==='Marine Corps JROTC'?'selected':''}>Marine Corps JROTC</option><option ${data.profile.service==='Space Force-related study'?'selected':''}>Space Force-related study</option><option ${data.profile.service==='Coast Guard-related study'?'selected':''}>Coast Guard-related study</option></select><label for="unit-area">Area / region / district (if applicable)</label><input class="field" id="unit-area" value="${esc(data.profile.area||'')}" placeholder="e.g. Area 18 / region"><button class="btn" type="submit">Save workspace preferences</button></form><p class="muted">This saves preferences on this device only. It does not create a shared unit or invite users.</p>`);
 h+=card('Records at a glance',`<div class="row"><div class="stat"><strong>${data.cadets.length}</strong><span class="muted">Roster entries</span></div><div class="stat"><strong>${data.participation.length}</strong><span class="muted">Participation logs</span></div><div class="stat"><strong>${data.inspections.length}</strong><span class="muted">Inspection records</span></div><div class="stat"><strong>${data.medals.length}</strong><span class="muted">Award records</span></div></div>`);
 }else if(tab==='Profile'){
 h='<h2>Cadet Profile</h2><p class="muted">Customize your dashboard. Avoid entering private or sensitive information.</p>';
 h+=card('Your information',`<form id="profile-form">${field('Display name','name',data.profile.name)}${field('Cadet rank','rank',data.profile.rank)}${field('Leadership role','role',data.profile.role)}${field('Unit / school','profile-unit',data.profile.unit||'My JROTC Unit')}<label for="profile-service">JROTC program</label><select class="field" id="profile-service"><option ${data.profile.service==='Navy NJROTC'?'selected':''}>Navy NJROTC</option><option ${data.profile.service==='Army JROTC'?'selected':''}>Army JROTC</option><option ${data.profile.service==='Air Force JROTC'?'selected':''}>Air Force JROTC</option><option ${data.profile.service==='Marine Corps JROTC'?'selected':''}>Marine Corps JROTC</option><option ${data.profile.service==='Space Force-related study'?'selected':''}>Space Force-related study</option><option ${data.profile.service==='Coast Guard-related study'?'selected':''}>Coast Guard-related study</option></select><button class="btn" type="submit">Save profile</button></form>`);
 h+=card('Your saved data','<p class="muted">Records are saved in this browser on this device; they are not synced to an account. Export a backup before clearing browser data.</p>'+btn('↻ Reload saved data','reload-data')+btn('Export backup','export-data','gold')+btn('Clear all saved data','clear-data','danger'));
 }
 content.innerHTML=h;
}
document.querySelector('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}});
content.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a.startsWith('go-')){tab=({'go-pt':'PT Tracking','go-awards':'Awards','go-study':'Study','go-profile':'Profile'})[a]||'Home';render()}
 else if(a.startsWith('delete-pt-')){data.pt.splice(Number(a.slice(10)),1);save();render()}
 else if(a.startsWith('delete-award-')){data.awards.splice(Number(a.slice(13)),1);save();render()}
 else if(a.startsWith('delete-part-')){data.participation.splice(Number(a.slice(12)),1);save();render()}
 else if(a.startsWith('delete-cadet-')){const i=Number(a.slice(13));data.cadets.splice(i,1);data.participation=data.participation.filter(r=>r.cadetIndex!==i);data.participation.forEach(r=>{if(r.cadetIndex>i)r.cadetIndex--});save();render()}
 else if(a.startsWith('delete-insp-')){data.inspections.splice(Number(a.slice(12)),1);save();render()}
 else if(a.startsWith('delete-medal-')){data.medals.splice(Number(a.slice(13)),1);save();render()}
 else if(a.startsWith('delete-rank-')){data.rankHistory.splice(Number(a.slice(11)),1);save();render()}
 else if(a.startsWith('delete-meet-')){data.meets.splice(Number(a.slice(12)),1);save();render()}
 else if(a.startsWith('delete-uniform-')){data.uniformNotes.splice(Number(a.slice(15)),1);save();render()}
 else if(a.startsWith('delete-service-')){data.serviceHours.splice(Number(a.slice(15)),1);save();render()}
 else if(a==='save-dojo'){const date=document.querySelector('#dojo-date').value,team=document.querySelector('#dojo-team').value.trim(),goal=document.querySelector('#dojo-goal').value.trim(),notes=document.querySelector('#dojo-notes').value.trim();data.awards.push({title:'Drill Dojo practice: '+(team||'Team not specified'),category:'Drill Practice',detail:'Date: '+date+'\nGoal: '+goal+'\nNotes: '+notes,date});save();render();status.textContent='Practice note saved to achievement log'}
 else if(a==='reload-data'){data=load();render();status.textContent='↻ Reloaded saved data'}
 else if(a==='export-data'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='jrotc-help-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='Backup export started'}
 else if(a==='clear-data'&&confirm('Delete all records saved in this browser? Export a backup first if you may need them.')){data=defaults();save();tab='Home';render();status.textContent='Saved records cleared'}
});
document.querySelector('#refresh').addEventListener('click',()=>{data=load();render();status.textContent='↻ Refreshed from saved data'});
content.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='pt-form'){let push=document.querySelector('#push').value,plank=document.querySelector('#plank').value,run=document.querySelector('#run').value;if([push,plank,run].some(x=>x!==''&&Number(x)<0)){status.textContent='Enter zero or a positive number.';return}data.pt.push({date:document.querySelector('#pt-date').value||new Date().toISOString().slice(0,10),push,plank,run,note:document.querySelector('#pt-note').value});save();render()}
 else if(e.target.id==='award-form'){let title=document.querySelector('#award-title').value.trim();if(!title){status.textContent='Add an achievement title first.';return}data.awards.push({title,category:document.querySelector('#award-category').value,detail:document.querySelector('#award-detail').value.trim(),date:new Date().toISOString().slice(0,10)});save();render()}
 else if(e.target.id==='cadet-form'){const name=document.querySelector('#cadet-name').value.trim();if(!name){status.textContent='Enter a cadet name or approved ID.';return}data.cadets.push({name,rank:document.querySelector('#cadet-rank').value.trim(),role:document.querySelector('#cadet-role').value.trim()});save();render()}
 else if(e.target.id==='participation-form'){const idx=Number(document.querySelector('#part-cadet').value);const c=data.cadets[idx];if(!c){status.textContent='Add a cadet to the roster first.';return}data.participation.push({cadetIndex:idx,cadetName:c.name,team:document.querySelector('#part-team').value,date:document.querySelector('#part-date').value,event:document.querySelector('#part-event').value.trim(),result:document.querySelector('#part-result').value.trim(),verification:document.querySelector('#part-verified').value,notes:document.querySelector('#part-notes').value.trim()});save();render()}
 else if(e.target.id==='inspection-form'){const score=Number(document.querySelector('#insp-score').value),max=Number(document.querySelector('#insp-max').value);if(!Number.isFinite(score)||!Number.isFinite(max)||max<=0||score<0||score>max){status.textContent='Enter a valid score from 0 to the maximum.';return}data.inspections.push({date:document.querySelector('#insp-date').value,name:document.querySelector('#insp-name').value.trim()||'Inspection',who:document.querySelector('#insp-who').value.trim(),score,max,checks:['ck-uniform','ck-groom','ck-knowledge','ck-records','ck-approval'].map(id=>document.querySelector('#'+id).checked),notes:document.querySelector('#insp-notes').value.trim()});save();render()}
 else if(e.target.id==='medal-form'){const name=document.querySelector('#medal-name').value.trim(),cadet=document.querySelector('#medal-cadet').value.trim();if(!name||!cadet){status.textContent='Enter the cadet and award name.';return}data.medals.push({cadet,name,date:document.querySelector('#medal-date').value,status:document.querySelector('#medal-status').value,evidence:document.querySelector('#medal-evidence').value.trim()});save();render()}
 else if(e.target.id==='meet-form'){const name=document.querySelector('#meet-name').value.trim();if(!name){status.textContent='Enter a meet or competition name.';return}data.meets.push({name,date:document.querySelector('#meet-date').value,area:document.querySelector('#meet-area').value.trim(),teams:document.querySelector('#meet-teams').value.trim(),cadets:document.querySelector('#meet-cadets').value.trim(),result:document.querySelector('#meet-result').value.trim(),status:document.querySelector('#meet-verified').value,notes:document.querySelector('#meet-notes').value.trim()});save();render()}
 else if(e.target.id==='service-hours-form'){const cadet=document.querySelector('#svc-cadet').value.trim(),hours=Number(document.querySelector('#svc-hours').value),task=document.querySelector('#svc-task').value.trim();if(!cadet||!task||!Number.isFinite(hours)||hours<=0){status.textContent='Enter a cadet identifier, task, and positive number of hours.';return}data.serviceHours.push({cadet,category:document.querySelector('#svc-category').value,date:document.querySelector('#svc-date').value||new Date().toISOString().slice(0,10),hours,task,supervisor:document.querySelector('#svc-supervisor').value.trim(),verification:document.querySelector('#svc-verification').value,notes:document.querySelector('#svc-notes').value.trim()});save();render()}
 else if(e.target.id==='uniform-form'){const cadet=document.querySelector('#uniform-cadet').value.trim(),type=document.querySelector('#uniform-type').value.trim();if(!cadet||!type){status.textContent='Enter a cadet ID/name and uniform type.';return}data.uniformNotes.push({cadet,type,date:document.querySelector('#uniform-date').value,items:document.querySelector('#uniform-items').value.trim(),status:document.querySelector('#uniform-status').value});save();render()}
 else if(e.target.id==='rank-form'){const cadet=document.querySelector('#rank-cadet').value.trim(),rank=document.querySelector('#rank-value').value.trim();if(!cadet||!rank){status.textContent='Enter cadet name and rank.';return}data.rankHistory.push({cadet,rank,date:document.querySelector('#rank-date').value,status:document.querySelector('#rank-verified').value});save();render()}
 else if(e.target.id==='unit-form'){data.profile={...data.profile,unit:document.querySelector('#unit-name').value.trim()||'My JROTC Unit',service:document.querySelector('#unit-service').value,area:document.querySelector('#unit-area').value.trim()};save();render()}
 else if(e.target.id==='profile-form'){data.profile={...data.profile,name:document.querySelector('#name').value.trim()||'Cadet',rank:document.querySelector('#rank').value.trim()||'Cadet',role:document.querySelector('#role').value.trim()||'Cadet',unit:document.querySelector('#profile-unit').value.trim()||'My JROTC Unit',service:document.querySelector('#profile-service').value};save();render()}
 else if(e.target.id==='quiz-form'){const f=new FormData(e.target),score=(f.get('q1')==='a')+(f.get('q2')==='b')+(f.get('q3')==='a');data.quizBest=Math.max(Number(data.quizBest)||0,score);save();const r=document.querySelector('#quiz-result');r.innerHTML=`<p><b>You scored ${score}/3.</b> ${score===3?'Excellent work!':'Review the answers and try again.'}</p><p class="muted">Correct answers: 1-A, 2-B, 3-A.</p>`}
});
content.addEventListener('change',e=>{if(e.target.id==='study-service'){const service=e.target.value;const guides={
'Navy NJROTC':'<p><b>Core values:</b> Honor, Courage, Commitment.</p><p><b>Study:</b> naval heritage, citizenship, leadership, chain of command, uniform care, drill, maritime awareness, and teamwork.</p>',
'Army JROTC':'<p><b>Program focus:</b> citizenship, leadership, personal responsibility, fitness, and service.</p><p><b>Study:</b> leadership principles, chain of command, drill and ceremonies, land navigation concepts, first aid awareness, and teamwork.</p>',
'Air Force JROTC':'<p><b>Program focus:</b> aerospace education, citizenship, leadership, and fitness.</p><p><b>Study:</b> aerospace fundamentals, leadership, chain of command, drill and ceremonies, space awareness, and teamwork.</p>',
'Marine Corps JROTC':'<p><b>Program focus:</b> citizenship, leadership, personal responsibility, and physical fitness.</p><p><b>Study:</b> Marine Corps history, leadership, chain of command, drill and ceremonies, uniform standards, and teamwork.</p>',
'Space Force-related study':'<p><b>Important:</b> Space Force has no separate JROTC program in this starter guide. Study space operations, space history, satellites, orbital basics, and aerospace careers as enrichment topics; use instructor-approved materials.</p>',
'Coast Guard-related study':'<p><b>Important:</b> Coast Guard has no separate JROTC program in this starter guide. Study maritime safety, search-and-rescue mission awareness, navigation concepts, and Coast Guard history as enrichment topics; use instructor-approved materials.</p>'};document.querySelector('#service-study').innerHTML=guides[service]+'<p class="muted">Use your service’s official cadet materials and instructor guidance for exact ranks, uniforms, awards, and regulations.</p>'}});
if(document.querySelector('#study-service')){document.querySelector('#study-service').value=data.profile.service||'Navy NJROTC';document.querySelector('#study-service').dispatchEvent(new Event('change',{bubbles:true}))}
render();
})();
</script>
</body>
</html>
